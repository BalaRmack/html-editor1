<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>Verdant Launcher</title>
    <style>
      /* Static by design: no React, no bundle — this paints on the first frame,
         which is the whole point of a splash screen. */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #070908;
        font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        color: #e9efec;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% -20%, rgba(16, 185, 129, 0.22), transparent 62%),
          radial-gradient(80% 70% at 100% 120%, rgba(47, 226, 140, 0.12), transparent 60%),
          #0b0d0c;
      }
      /* faint grid, the same texture the app uses */
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: radial-gradient(90% 70% at 50% 40%, #000 30%, transparent 78%);
      }
      .glow {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(47, 226, 140, 0.3), transparent 66%);
        filter: blur(14px);
        top: -90px;
        animation: pulse 3.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.08);
        }
      }
      .mark {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #34d399, #047857);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12) inset,
          0 18px 38px -12px rgba(16, 185, 129, 0.85);
      }
      .logo svg {
        width: 27px;
        height: 27px;
      }
      .titles {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .name {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .name span {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.34em;
        color: #7d8e88;
        margin-left: 8px;
        text-transform: uppercase;
      }
      .tagline {
        font-size: 11.5px;
        color: #9fb0aa;
      }
      .bar {
        position: relative;
        width: 208px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(16, 185, 129, 0), #2fe28c 45%, rgba(47, 226, 140, 0));
        animation: slide 1.35s cubic-bezier(0.6, 0, 0.4, 1) infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      .status {
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6d7f79;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="mark">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#04150e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
          </svg>
        </div>
        <div class="titles">
          <div class="name">Verdant <span>Launcher</span></div>
          <div class="tagline">Лаунчер, которому не стыдно показаться</div>
        </div>
      </div>
      <div class="bar"></div>
      <div class="status" id="status">Запуск</div>
    </div>
  </body>
</html>
