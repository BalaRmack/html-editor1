name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + preload + renderer)
        run: npm run typecheck

      - name: Unit tests (uuid, maven, jvm args, png, launch args)
        run: npm run test

      - name: Renderer smoke tests (jsdom + mock backend)
        run: npm run test:ui

      - name: Build
        run: npm run build:only

  installer:
    name: Windows bootstrapper (Electron setup)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build main + renderer
        run: npm run build:only

      # The launcher ships as an unpacked folder (payload), never as an NSIS
      # installer: the bootstrapper unpacks it into %LOCALAPPDATA%\VerdantLauncher.
      - name: Build launcher payload
        run: npx electron-builder --win --x64 --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify payload asar
        shell: pwsh
        run: |
          $list = (npx --yes @electron/asar list "release\win-unpacked\resources\app.asar") -join "`n"
          foreach ($needle in @('out[\\/]main[\\/]index\.js', 'out[\\/]renderer[\\/]index\.html', 'node_modules[\\/]@xmcl[\\/]installer')) {
            if ($list -notmatch $needle) { throw "Missing in asar: $needle" }
          }

      - name: Sign launcher payload
        shell: bash
        run: node scripts/sign-artifact.mjs "release/win-unpacked/VerdantLauncher.exe"
        env:
          VERDANT_SIGN_CMD: ${{ secrets.VERDANT_SIGN_CMD }}

      - name: Pack payload into app.zip
        run: node scripts/make-payload.mjs release/win-unpacked dist-payload/app.zip

      - name: Build bootstrapper UI
        run: npx electron-vite build --config electron.vite.installer.config.ts

      # This is the real proof that the custom bootstrapper compiles into one
      # portable .exe with the payload inside — NSIS is not involved anywhere.
      - name: Package bootstrapper
        run: npx electron-builder --win --x64 --config electron-builder.installer.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify bootstrapper
        shell: pwsh
        run: |
          $payload = Get-Item "dist-payload\app.zip"
          Write-Host ("payload: {0:N1} MB" -f ($payload.Length / 1MB))
          $setup = Get-ChildItem "release-installer\*.exe" | Select-Object -First 1
          if (-not $setup) { throw "bootstrapper exe not found" }
          Write-Host ("setup: {0} ({1:N1} MB)" -f $setup.Name, ($setup.Length / 1MB))
          if ($setup.Length -lt 60MB) { throw "setup exe is suspiciously small" }

      - name: Sign bootstrapper
        shell: bash
        run: node scripts/sign-artifact.mjs release-installer/*.exe
        env:
          VERDANT_SIGN_CMD: ${{ secrets.VERDANT_SIGN_CMD }}

      - name: Report signature status
        shell: pwsh
        env:
          VERDANT_SIGN_CMD: ${{ secrets.VERDANT_SIGN_CMD }}
        run: |
          $expected = -not [string]::IsNullOrWhiteSpace($env:VERDANT_SIGN_CMD)
          foreach ($file in @(Get-ChildItem "release-installer\*.exe")) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host ("{0}: {1}" -f $file.Name, $sig.Status)
            if ($expected -and $sig.Status -ne 'Valid') { throw "Подпись недействительна: $($file.Name) ($($sig.Status))" }
          }
          if (-not $expected) { Write-Host "::warning title=Сборка без подписи::VERDANT_SIGN_CMD не задан — см. docs/SMARTSCREEN.md" }

      - name: Write checksums + winget manifest
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release-installer\*.exe" | Select-Object -First 1
          $version = node -p "require('./package.json').version"
          node scripts/make-winget-manifest.mjs --version $version --from $setup.FullName --out dist-winget
          Get-Content "dist-winget\checksums.txt"

      # `winget validate` is the authoritative schema check, but the runner's
      # winget version drifts, so it warns instead of failing the build — the
      # blocking check is the ajv/JSON-Schema test in `npm test`.
      - name: Validate winget manifest
        shell: pwsh
        continue-on-error: true
        run: |
          $output = winget validate --manifest dist-winget 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            $reason = ($output -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 3) -join ' / '
            Write-Host "::warning title=winget validate::$($reason -replace '%','%25')"
          }

      # Parses install.ps1 with the real PowerShell parser: no execution, no
      # network, but a typo in the script users pipe into `iex` fails the build.
      - name: Validate install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error title=install.ps1::$($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1: синтаксис в порядке"

      - name: Upload bootstrapper
        uses: actions/upload-artifact@v4
        with:
          name: verdant-launcher-setup
          path: release-installer/*.exe
          if-no-files-found: error

  network:
    name: Live API integration (Mojang / Fabric / Modrinth)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live metadata + install smoke test
        run: npx vitest run tests/network.test.ts
        env:
          VERDANT_NET_TESTS: '1'
