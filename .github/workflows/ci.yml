name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + preload + renderer)
        run: npm run typecheck

      - name: Unit tests (uuid, maven, jvm args, png, launch args)
        run: npm run test

      - name: Renderer smoke tests (jsdom + mock backend)
        run: npm run test:ui

      - name: Build
        run: npm run build:only

  installer:
    name: Windows installer (NSIS wizard)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build main + renderer
        run: npm run build:only

      # Compiles build/installer.nsh for real: the wizard, its bitmaps and the
      # uninstaller page are only exercised by makensis.
      - name: Package NSIS installer
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win nsis --x64 --publish never 2>&1 | tee nsis-build.log; then
            N=0
            tail -n 40 nsis-build.log | while IFS= read -r line; do
              N=$((N + 1))
              echo "::error title=nsis-$N::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-900)"
            done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsis-build-log
          path: nsis-build.log
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: verdant-launcher-setup
          path: release/*.exe
          if-no-files-found: error

  network:
    name: Live API integration (Mojang / Fabric / Modrinth)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live metadata + install smoke test
        run: npx vitest run tests/network.test.ts
        env:
          VERDANT_NET_TESTS: '1'
