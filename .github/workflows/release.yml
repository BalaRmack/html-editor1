name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! npx vitest run --config vitest.config.ts 2>&1 | tee unit-tests.log; then
            N=0
            grep -inE "FAIL|AssertionError|Error:|expected" unit-tests.log | sed 's/^[[:space:]]*//' | tail -n 12 | while IFS= read -r line; do
              N=$((N + 1))
              echo "::error title=T$N::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-800)"
            done
            exit 1
          fi

      - name: Renderer smoke tests
        shell: bash
        run: |
          set -o pipefail
          if ! npx vitest run --config vitest.ui.config.ts 2>&1 | tee ui-tests.log; then
            N=0
            grep -inE "FAIL|AssertionError|Error:|expected" ui-tests.log | sed 's/^[[:space:]]*//' | tail -n 12 | while IFS= read -r line; do
              N=$((N + 1))
              echo "::error title=U$N::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-800)"
            done
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer + main + preload
        run: npm run build:only

      - name: Build NSIS installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: dir release
        shell: cmd

      - name: Verify packaged app (asar contents)
        shell: pwsh
        run: |
          $list = (npx --yes @electron/asar list "release\win-unpacked\resources\app.asar") -join "`n"
          $needles = @(
            'out[\\/]main[\\/]index\.js',
            'out[\\/]preload[\\/]index\.js',
            'out[\\/]renderer[\\/]index\.html',
            'node_modules[\\/]@xmcl[\\/]core',
            'node_modules[\\/]@xmcl[\\/]installer',
            'node_modules[\\/]adm-zip',
            'build[\\/]icon\.png'
          )
          foreach ($needle in $needles) {
            if ($list -notmatch $needle) { throw "Missing in asar: $needle" }
            Write-Host "found $needle"
          }
          $exe = Get-Item "release\win-unpacked\VerdantLauncher.exe"
          Write-Host ("executable: {0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB))

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdant-launcher-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Verdant Launcher ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Verdant Launcher ${{ github.ref_name }}

            Премиальный лаунчер Minecraft: Vanilla / Fabric / Quilt / Forge / NeoForge,
            offline-профиль, менеджер изолированных сборок, Modrinth в один клик, консоль с подсветкой.

            ### Новое в 1.1.0
            - **Ошибки загрузки больше не скрываются.** Прерванное скачивание показывает красный тост
              с реальным текстом ошибки и кнопкой «Повторить»; кнопка «Играть» активна только после
              успешной проверки целостности, иначе — «Ошибка загрузки» и список проблемных файлов.
            - **Свой установщик и деинсталлятор.** Тёмный мастер в стиле Verdant с изумрудным
              прогресс-баром, брендированными сайдбаром и шапкой; при удалении — галочка
              «Удалить настройки и сохранения» и кнопки «Удалить» / «Отмена».
            - Проверка целостности: client jar, библиотеки, нативы, asset index и все объекты ассетов.
            - Отмена установки больше не считается ошибкой.

            Полный список изменений: https://github.com/BalaRmack/html-editor1/compare/v1.0.0...${{ github.ref_name }}

            ### Установка
            1. Скачайте `Verdant-Launcher-*-Setup.exe` ниже.
            2. Запустите установщик (ярлыки на Рабочем столе и в меню «Пуск» создаются автоматически).
            3. Введите никнейм и нажмите «ИГРАТЬ».

            > SmartScreen может показать предупреждение, потому что установщик не подписан
            > сертификатом code signing. «Подробнее» → «Выполнить в любом случае».

            ### Что внутри
            - Electron 45 + React 18 + TypeScript + Vite + Tailwind CSS 4 + Zustand + Framer Motion
            - Ядро запуска: `@xmcl/core` + `@xmcl/installer` (корректные нативы, classpath, Forge post-processors)
            - Автоскачивание Java (Mojang JRE), поиск JDK в реестре Windows
            - Проверка целостности файлов и докачка битых
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
