appId: app.verdant.launcher
productName: Verdant Launcher
copyright: Copyright © 2026 BalaRmack

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - build/icon.png
  - build/icon-256.png
  - '!**/*.map'
  - '!**/*.ts'

asar: true
npmRebuild: false
compression: maximum
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: VerdantLauncher
  artifactName: Verdant-Launcher-${version}-Setup.${ext}
  legalTrademarks: Verdant Launcher
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Verdant Launcher
  uninstallDisplayName: Verdant Launcher
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  license: build/license.txt

publish:
  provider: github
  owner: BalaRmack
  repo: html-editor1
  releaseType: release
